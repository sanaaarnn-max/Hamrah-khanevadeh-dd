*{box-sizing:border-box}
body{
 margin:0;font-family:Tahoma,Arial,sans-serif;background:#fff;

}
header{

 box-shadow:0 2px 10px #ddd
}
header h1{margin:0;color:#222;font-size:27px}
header p{margin:8px 0 3px;color:#444}
header small{color:#333}
.container{max-width:1000px;margin:auto;padding:20px}
.card{
 background:#fff;border:1px solid #f1d9e1;border-radius:18px;
 padding:20px;margin:15px 0;box-shadow:0 4px 15px #eee
}
.login{
 max-width:500px;margin:45px auto
}
h2,h3{color:#444}
input,select,textarea{

}
button{

}
button:hover{opacity:.85}
.btn2{background:#eee}
.danger{background:#f3b0b0}
.green{background:#bde5c8}
.hidden{display:none!important}
.menu{
 display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
 gap:12px;margin:15px 0
}
.menu button{min-height:58px;font-size:14px}
.stat{
 display:inline-block;background:#fff1f5;border-radius:14px;
 padding:15px;margin:5px;min-width:130px;text-align:center
}
.student{
 border:1px solid #eee;border-radius:13px;padding:13px;
 margin:8px 0;background:#fff
}
.student-row{
 display:flex;justify-content:space-between;gap:10px;
 align-items:center
}
.badge{

}
.msg,.notice{

}
.teacher-box{

 padding:12px;border-radius:12px;margin:8px 0
}
.checks{

 gap:8px;margin-top:10px
}
.check{
 background:#fff;border:1px solid #eee;padding:9px;
 border-radius:9px
}
.check input{width:auto;margin-left:6px}
table{width:100%;border-collapse:collapse;margin-top:10px}
td,th{border:1px solid #eee;padding:9px;text-align:center}
th{background:#fbe1e9}
.back{background:#ddd}
footer{text-align:center;color:#888;padding:25px}

</head>

function save(){

}

function esc(x){
 return String(x??"").replace(/[&<>"']/g,m=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",
 '"':"&quot;","'":"&#039;"
 }[m]));
}

function normalize(x){
 return String(x??"").replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d))
 .replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d));
}

function gradeText(g){
 return "پایه "+g+" ابتدایی";
}

function getStudent(code){
 return students.find(s=>normalize(s[0])===normalize(code));
}

function assignedTeachers(code){
 return teachers.filter(t=>(assignments[code]||[]).includes(t.u));
}

function teacherHasExplicit(u){
 return Object.values(assignments).some(a=>Array.isArray(a)&&a.includes(u));
}

function getTeacherStudents(u){
 const t=teachers.find(x=>x.u===u);
 if(!t)return[];
 if(teacherHasExplicit(u)){
  return students.filter(s=>(assignments[s[0]]||[]).includes(u));
 }
 return students.filter(s=>t.grades.includes(s[2]));
}

function hideAll(){
 document.getElementById("parentPanel").classList.add("hidden");
 document.getElementById("teacherPanel").classList.add("hidden");
 document.getElementById("adminPanel").classList.add("hidden");
}

function login(){
 const r=document.getElementById("loginRole").value;
 const u=normalize(document.getElementById("username").value.trim());
 const p=normalize(document.getElementById("password").value.trim());
 const err=document.getElementById("loginError");

 err.textContent="";

 if(r==="admin"){
  if(u===admin.u&&p===admin.p){
   role="admin";currentUser=admin;openPanel();
   return;
  }
 }

 if(r==="teacher"){
  const t=teachers.find(x=>x.u.toLowerCase()===u.toLowerCase()&&normalize(x.p)===p);
  if(t){
   role="teacher";currentUser=t;openPanel();
   return;
  }
 }

 if(r==="parent"){
  const s=getStudent(u);
  if(s&&normalize(s[0])===p){
   role="parent";currentUser=s;currentStudent=s;openPanel();
   return;
  }
 }

 err.textContent="نام کاربری یا رمز عبور صحیح نیست.";
}

function openPanel(){
 document.getElementById("loginPage").classList.add("hidden");
 document.getElementById("app").classList.remove("hidden");
 hideAll();

 document.getElementById("welcome").textContent=
 role==="admin"?"سلام مدیر مدرسه 🌷":
 role==="teacher"?"سلام "+currentUser.name+" 🌷":
 "سلام خانواده "+currentStudent[1]+" 🌷";

 if(role==="parent"){
  document.getElementById("parentPanel").classList.remove("hidden");
  parentHome();
 }
 if(role==="teacher"){
  document.getElementById("teacherPanel").classList.remove("hidden");
  teacherHome();
 }
 if(role==="admin"){
  document.getElementById("adminPanel").classList.remove("hidden");
  adminHome();
 }
}

 requests.push({

  name:currentStudent[1],

  status:"در انتظار بررسی",
  date:new Date().toLocaleDateString("fa-IR")
 });
 save();parentRequests();
 alert("درخواست با موفقیت ثبت شد.");
}

 const today=new Date().toLocaleDateString("fa-IR");
 if(!attendance[today])attendance[today]={};

 arr.forEach(s=>{

  if(el)attendance[today][s[0]]=el.value;
 });
 save();
 alert("حضور و غیاب ذخیره شد.");
}

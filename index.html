*{box-sizing:border-box}
body{

}
.container{max-width:900px;margin:auto;padding:15px}

.header{

}
.header h1{margin:0;color:#222;font-size:29px}
.header p{margin:8px 0;color:#403640}
.header small{color:#222}

.card{
 background:#fff5f8;

 padding:18px;
 margin:12px 0;

}

.login{
 max-width:450px;
 margin:28px auto;
 text-align:center
}

button{
 width:100%;
 border:0;
 border-radius:12px;
 padding:13px;
 margin-top:10px;
 background:#d98eaa;
 color:#fff;
 font-size:16px;
 font-family:inherit;
 cursor:pointer
}
button:hover{opacity:.88}
.gray{background:#938991}
.red{background:#c96f7d}
.green{background:#8fbd9b}

input,select,textarea{
 width:100%;
 padding:12px;
 margin-top:9px;
 border:1px solid #e4d1d9;
 border-radius:11px;
 font-family:inherit;
 background:#fff
}
textarea{min-height:100px}

.hidden{display:none!important}

.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
 gap:10px
}

.stat{
 background:#fcecf2;
 padding:16px;
 border-radius:14px;
 text-align:center
}

.box{
 background:#fff8fa;
 border:1px solid #f1d9e2;
 padding:14px;
 border-radius:13px;

}

.student{

 border:1px solid #efd9e2;

 padding:14px;
 margin:10px 0
}
.student b{color:#c87998;font-size:17px}

 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
 gap:10px
}

.menu button{
 margin:0;

}

.badge{

}

.teacher-grid{

}

</div>

function normalize(x){
 return String(x||"")
 .replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d))
 .replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d));
}

function esc(x){
 return String(x??"").replace(/[&<>"']/g,m=>({
 "&":"&amp;",
 "<":"&lt;",
 ">":"&gt;",
 '"':"&quot;",
 "'":"&#039;"
 }[m]));
}

function gradeText(g){
 return "پایه "+g+" ابتدایی";
}

function getStudent(code){
 return students.find(
  s=>normalize(s[0])===normalize(code)
 );
}

function getStudentTeachers(code){
 let list=assignments[code]||[];
 return teachers.filter(t=>list.includes(t.u));
}

function teacherHasAssignment(u){
 return Object.values(assignments)
 .some(list=>Array.isArray(list)&&list.includes(u));
}

function getTeacherStudents(u){

 const t=teachers.find(x=>x.u===u);
 if(!t)return[];

 if(teacherHasAssignment(u)){
  return students.filter(
   s=>(assignments[s[0]]||[]).includes(u)
  );
 }

 return students.filter(
  s=>t.grades.includes(s[2])
 );
}

function showLogin(r){

 role=r;

 document.getElementById("home")
 .classList.add("hidden");

 document.getElementById("loginBox")
 .classList.remove("hidden");

 document.getElementById("app")
 .classList.add("hidden");

 document.getElementById("username").value="";
 document.getElementById("password").value="";
 document.getElementById("error").textContent="";

 r==="teacher"?"👩‍🏫 ورود معلم":
 "👩‍💼 ورود مدیریت";

 document.getElementById("loginTitle").textContent=title;

 setTimeout(()=>{
  document.getElementById("username").focus();
 },100);
}

function login(){

 let u=normalize(
  document.getElementById("username").value.trim()
 );

 let p=normalize(
  document.getElementById("password").value.trim()
 );

 let error=document.getElementById("error");

 error.textContent="";

 if(!u||!p){
  error.textContent="لطفاً نام کاربری و رمز عبور را وارد کنید.";
  return;
 }

 if(role==="admin" &&
    u===admin.u &&
    p===normalize(admin.p)){

  currentUser=admin;
  openPanel();
  return;
 }

 if(role==="teacher"){

  let t=teachers.find(x=>
   x.u.toLowerCase()===u.toLowerCase() &&
   normalize(x.p)===p
  );

  if(t){
   currentUser=t;
   openPanel();
   return;
  }
 }

 if(role==="parent"){

  let s=getStudent(u);

  if(s && normalize(s[0])===p){

function renderAssignments(){

 let grade=document.getElementById("assignGrade").value;
 let search=document.getElementById("assignSearch").value.trim();

 let arr=students.filter(s=>
  (grade==="all"||String(s[2])===grade) &&
  (!search||s[1].includes(search))
 );

 document.getElementById("assignmentList").innerHTML=

 arr.map(s=>{

  let selected=
   Array.isArray(assignments[s[0]])
   ? assignments[s[0]]
   : [];

  let selectedTeachers=
   teachers.filter(t=>selected.includes(t.u));

  return `
  <div class="student">

  <b>👤 ${esc(s[1])}</b><br>
  <small>${gradeText(s[2])}</small>

  <div class="teacher-grid">

  ${
   teachers.map(t=>`

   <label class="teacher-option">

   <input
   type="checkbox"
   ${selected.includes(t.u)?"checked":""}
   onchange="
   changeTeacherAssignment(
   '${s[0]}',
   '${t.u}',
   this.checked
   )">

   ${esc(t.name)}

   </label>

   `).join("")
  }

  </div>

  <div class="selected-box">

  <b>معلم‌های انتخاب‌شده:</b><br>

  ${
   selectedTeachers.length
   ?
   selectedTeachers.map(t=>
   `<span class="badge">${esc(t.name)}</span>`
   ).join("")
   :
   "هنوز معلمی انتخاب نشده است."
  }

  </div>

  </div>
  `;
 }).join("")||"<div class='box'>دانش‌آموزی پیدا نشد.</div>";
}

function changeTeacherAssignment(
 studentCode,
 teacherUsername,
 checked
){

 if(!Array.isArray(assignments[studentCode])){
  assignments[studentCode]=[];
 }

 if(checked){

  if(!assignments[studentCode]
  .includes(teacherUsername)){

   assignments[studentCode]
   .push(teacherUsername);
  }

 }else{

  assignments[studentCode]=
  assignments[studentCode]
  .filter(x=>x!==teacherUsername);

  if(!assignments[studentCode].length){
   delete assignments[studentCode];
  }
 }

 saveAll();

 renderAssignments();
}

header small{color:#222}
.container{max-width:1050px;margin:auto;padding:20px}
.card{

}
.login{max-width:500px;margin:45px auto}
input,select,textarea{

.student-top{

.notice,.msg{

function normalize(x){
 return String(x||"")
 .replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d))
 .replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d));
}

function esc(x){
 return String(x??"").replace(/[&<>"']/g,m=>({
 "&":"&amp;",
 "<":"&lt;",
 ">":"&gt;",
 '"':"&quot;",
 "'":"&#039;"
 }[m]));
}

function gradeText(g){
 return "پایه "+g+" ابتدایی";
}

function getStudent(code){
 return students.find(
  s=>normalize(s[0])===normalize(code)
 );
}

/* همه معلم‌های یک دانش‌آموز */
function getStudentTeachers(code){
 const list=assignments[code]||[];
 return teachers.filter(t=>list.includes(t.u));
}

/* آیا برای این معلم اختصاص اختصاصی ثبت شده؟ */
function teacherHasAssignment(u){
 return Object.values(assignments)
 .some(list=>Array.isArray(list)&&list.includes(u));
}

/* دانش‌آموزان قابل مشاهده هر معلم */
function getTeacherStudents(u){

 const t=teachers.find(x=>x.u===u);

 if(!t)return[];

 /*
  اگر برای این معلم حتی یک اختصاص اختصاصی ثبت شده باشد،
  فقط همان دانش‌آموزان را نشان می‌دهیم.
 */
 if(teacherHasAssignment(u)){
  return students.filter(
   s=>(assignments[s[0]]||[]).includes(u)
  );
 }

 /*
  اگر هنوز برای این معلم اختصاص اختصاصی ثبت نشده،
  پایه‌های پیش‌فرض خودش نمایش داده می‌شود.
 */
 return students.filter(
  s=>t.grades.includes(s[2])
 );
}

function login(){

 const r=document.getElementById("loginRole").value;
 const u=normalize(
  document.getElementById("username").value.trim()
 );
 const p=normalize(
  document.getElementById("password").value.trim()
 );

 const error=document.getElementById("loginError");
 error.textContent="";

 if(r==="admin"){

  if(u===admin.u && p===admin.p){

   role="admin";
   currentUser=admin;

   openPanel();
   return;
  }
 }

 if(r==="teacher"){

  const t=teachers.find(x=>
   x.u.toLowerCase()===u.toLowerCase() &&
   normalize(x.p)===p
  );

  if(t){

   role="teacher";
   currentUser=t;

   openPanel();
   return;
  }
 }

 if(r==="parent"){

  const s=getStudent(u);

  if(s && normalize(s[0])===p){

   role="parent";
   currentUser=s;
   currentStudent=s;

   openPanel();
   return;
  }
 }

 error.textContent=
 "نام کاربری یا رمز عبور صحیح نیست.";
}

function openPanel(){

 document.getElementById("loginPage")
 .classList.add("hidden");

 document.getElementById("app")
 .classList.remove("hidden");

 document.getElementById("parentPanel")
 .classList.add("hidden");

 document.getElementById("teacherPanel")
 .classList.add("hidden");

 document.getElementById("adminPanel")
 .classList.add("hidden");

 if(role==="admin"){

  document.getElementById("welcome").textContent=
  "سلام مدیر مدرسه 🌷";

  document.getElementById("adminPanel")
  .classList.remove("hidden");

  adminHome();
 }

 if(role==="teacher"){

  document.getElementById("welcome").textContent=
  "سلام "+currentUser.name+" 🌷";

  document.getElementById("teacherPanel")
  .classList.remove("hidden");

  teacherHome();
 }

 if(role==="parent"){

  document.getElementById("welcome").textContent=
  "سلام خانواده "+currentStudent[1]+" 🌷";

  document.getElementById("parentPanel")
  .classList.remove("hidden");

  parentHome();
 }
}

function sendRequest(){

 const text=
 document.getElementById("requestText")
 .value.trim();

 if(!text){
  alert("متن درخواست را وارد کنید.");
  return;
 }

 requests.push({
  student:currentStudent[0],
  name:currentStudent[1],
  text:text,
  status:"در انتظار بررسی",
  date:new Date().toLocaleDateString("fa-IR")
 });

 saveAll();

 parentRequests();

 alert("درخواست ثبت شد.");
}
